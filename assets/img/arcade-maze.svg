<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="1000"
     viewBox="0 0 1600 1000">

  <!-- CIPHER Arcade Maze - transparent background -->

  <g fill="none"
     stroke="#3478F6"
     stroke-width="5"
     stroke-linejoin="round"
     stroke-linecap="square">

    <!-- Upper-left maze -->
    <path d="M0 170 H35 V105 H80 V65 H300 V0"/>
    <path d="M0 220 H65 V145 H110 V115 H345 V0"/>

    <!-- Upper-middle maze -->
    <path d="M580 0 V45 H960 V105 H1030 V0"/>
    <path d="M700 0 V85 H910 V145 H980 V205 H1040 V0"/>

    <!-- Upper-right maze -->
    <path d="M1600 55 H1450 V115 H1390 V195 H1240"/>
    <path d="M1600 105 H1500 V165 H1440 V245 H1280"/>

    <!-- Left-side maze -->
    <path d="M0 420 H65 V485 H125 V540 H0"/>
    <path d="M0 465 H35 V525 H95 V585 H0"/>

    <!-- Right-side maze -->
    <path d="M1600 390 H1490 V455 H1410 V515 H1600"/>
    <path d="M1600 435 H1530 V495 H1450 V565 H1600"/>

    <!-- Lower-left maze -->
    <path d="M0 770 H75 V830 H155 V895 H305 V1000"/>
    <path d="M0 820 H40 V875 H120 V940 H260 V1000"/>

    <!-- Lower-right maze -->
    <path d="M1600 765 H1490 V825 H1400 V895 H1250 V1000"/>
    <path d="M1600 815 H1530 V875 H1440 V945 H1310 V1000"/>

  </g>

  <!-- Yellow pixel dots -->
  <g fill="#FFD83D">
    <!-- Top -->
    <rect x="165" y="30" width="8" height="8"/>
    <rect x="205" y="30" width="8" height="8"/>
    <rect x="245" y="30" width="8" height="8"/>
    <rect x="285" y="30" width="8" height="8"/>

    <rect x="1150" y="35" width="8" height="8"/>
    <rect x="1190" y="35" width="8" height="8"/>
    <rect x="1230" y="35" width="8" height="8"/>
    <rect x="1270" y="35" width="8" height="8"/>

    <!-- Middle -->
    <rect x="1160" y="335" width="8" height="8"/>
    <rect x="1200" y="335" width="8" height="8"/>
    <rect x="1240" y="335" width="8" height="8"/>
    <rect x="1280" y="335" width="8" height="8"/>

    <rect x="80" y="640" width="8" height="8"/>
    <rect x="120" y="640" width="8" height="8"/>
    <rect x="160" y="640" width="8" height="8"/>
    <rect x="200" y="640" width="8" height="8"/>

    <!-- Bottom -->
    <rect x="460" y="935" width="8" height="8"/>
    <rect x="500" y="935" width="8" height="8"/>
    <rect x="540" y="935" width="8" height="8"/>
    <rect x="580" y="935" width="8" height="8"/>

    <rect x="1190" y="735" width="8" height="8"/>
    <rect x="1230" y="735" width="8" height="8"/>
    <rect x="1270" y="735" width="8" height="8"/>
    <rect x="1310" y="735" width="8" height="8"/>
  </g>

</svg>
